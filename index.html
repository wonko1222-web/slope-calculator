
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경사도 계산기</title>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    margin: 0;
    padding: 24px;
    color: #222;
  }

  .calculator {
    max-width: 520px;
    margin: 0 auto;
    background: white;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
  }

  h1 {
    font-size: 25px;
    margin: 0 0 8px;
  }

  .description {
    color: #777;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .section { margin-bottom: 25px; }

  .section-title {
    font-weight: bold;
    margin-bottom: 12px;
    font-size: 16px;
  }

  .tabs {
    display: flex;
    gap: 8px;
  }

  button {
    cursor: pointer;
    border: 1px solid #d8dce3;
    background: white;
    border-radius: 9px;
    padding: 12px;
    font-size: 15px;
  }

  .tabs button {
    flex: 1;
  }

  button.active {
    background: #2457d6;
    color: white;
    border-color: #2457d6;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d8dce3;
    border-radius: 9px;
    font-size: 17px;
    margin-top: 8px;
  }

  .unit {
    color: #777;
    font-size: 13px;
    margin-top: 6px;
  }

  .result {
    background: #f0f5ff;
    border-radius: 12px;
    padding: 18px;
    margin-top: 10px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #dce5f5;
  }

  .result-row:last-child {
    border-bottom: none;
  }

  .result-value {
    font-size: 21px;
    font-weight: bold;
    color: #2457d6;
  }

  .error {
    color: #d93025;
    font-size: 13px;
    margin-top: 10px;
  }

  .reset {
    width: 100%;
    margin-top: 20px;
    background: #f3f4f6;
  }

  .formula {
    color: #777;
    font-size: 12px;
    line-height: 1.7;
    margin-top: 18px;
  }
</style>
</head>

<body>

<div class="calculator">

  <h1>📐 경사도 계산기</h1>
  <div class="description">
    경사값과 기준 길이를 입력하면 수평길이와 수직길이를 자동으로 계산합니다.
  </div>

  <div class="section">
    <div class="section-title">① 경사값 입력 방식</div>

    <div class="tabs">
      <button id="percentBtn" class="active" onclick="setMode('percent')">
        경사율 (%)
      </button>
      <button id="ratioBtn" onclick="setMode('ratio')">
        기울기 (1:n)
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="slopeLabel">② 경사율 입력 (%)</div>
    <input
      type="number"
      id="slopeValue"
      placeholder="예: 12"
      min="0"
      step="any"
      oninput="calculate()"
    >
    <div class="unit" id="slopeHelp">
      예: 12를 입력하면 경사율 12%로 계산합니다.
    </div>
  </div>

  <div class="section">
    <div class="section-title">③ 알고 있는 기준 길이 선택</div>

    <div class="tabs">
      <button id="horizontalBtn" class="active"
        onclick="setLengthType('horizontal')">
        수평길이
      </button>
      <button id="verticalBtn"
        onclick="setLengthType('vertical')">
        수직길이
      </button>
    </div>

    <input
      type="number"
      id="knownLength"
      placeholder="기준 길이를 입력하세요"
      min="0"
      step="any"
      oninput="calculate()"
    >
    <div class="unit">단위: m (미터)</div>
  </div>

  <div class="section">
    <div class="section-title">④ 계산 결과</div>

    <div class="result">
      <div class="result-row">
        <span>수평길이</span>
        <span class="result-value" id="horizontalResult">- m</span>
      </div>

      <div class="result-row">
        <span>수직길이</span>
        <span class="result-value" id="verticalResult">- m</span>
      </div>
    </div>

    <div id="errorMessage" class="error"></div>
  </div>

  <button class="reset" onclick="resetCalculator()">
    초기화
  </button>

  <div class="formula">
    <b>계산 기준</b><br>
    • 경사율(%) = 수직길이 ÷ 수평길이 × 100<br>
    • 기울기(1:n) = 수직길이 : 수평길이<br>
    • 기울기 1:12는 수평 12m당 수직 1m를 의미합니다.
  </div>

</div>

<script>
  let mode = "percent";
  let lengthType = "horizontal";

  function setMode(selectedMode) {
    mode = selectedMode;

    document.getElementById("percentBtn")
      .classList.toggle("active", mode === "percent");

    document.getElementById("ratioBtn")
      .classList.toggle("active", mode === "ratio");

    if (mode === "percent") {
      document.getElementById("slopeLabel").innerText =
        "② 경사율 입력 (%)";

      document.getElementById("slopeHelp").innerText =
        "예: 12를 입력하면 경사율 12%로 계산합니다.";

      document.getElementById("slopeValue").placeholder = "예: 12";
    } else {
      document.getElementById("slopeLabel").innerText =
        "② 기울기 입력 (1:n의 n값)";

      document.getElementById("slopeHelp").innerText =
        "예: 12를 입력하면 기울기 1:12로 계산합니다.";

      document.getElementById("slopeValue").placeholder = "예: 12";
    }

    calculate();
  }

  function setLengthType(selectedType) {
    lengthType = selectedType;

    document.getElementById("horizontalBtn")
      .classList.toggle("active", lengthType === "horizontal");

    document.getElementById("verticalBtn")
      .classList.toggle("active", lengthType === "vertical");

    calculate();
  }

  function calculate() {
    const slope = Number(document.getElementById("slopeValue").value);
    const known = Number(document.getElementById("knownLength").value);

    const horizontalOutput =
      document.getElementById("horizontalResult");

    const verticalOutput =
      document.getElementById("verticalResult");

    const error = document.getElementById("errorMessage");

    horizontalOutput.innerText = "- m";
    verticalOutput.innerText = "- m";
    error.innerText = "";

    if (
      document.getElementById("slopeValue").value === "" ||
      document.getElementById("knownLength").value === ""
    ) return;

    if (
      !Number.isFinite(slope) ||
      !Number.isFinite(known) ||
      slope <= 0 ||
      known <= 0
    ) {
      error.innerText = "경사값과 길이는 0보다 큰 숫자를 입력하세요.";
      return;
    }

    let horizontal;
    let vertical;

    // 경사율 방식
    if (mode === "percent") {
      if (lengthType === "horizontal") {
        horizontal = known;
        vertical = horizontal * slope / 100;
      } else {
        vertical = known;
        horizontal = vertical * 100 / slope;
      }
    }

    // 기울기 방식 (1:n)
    else {
      if (lengthType === "horizontal") {
        horizontal = known;
        vertical = horizontal / slope;
      } else {
        vertical = known;
        horizontal = vertical * slope;
      }
    }

    if (
      !Number.isFinite(horizontal) ||
      !Number.isFinite(vertical)
    ) {
      error.innerText = "계산할 수 없는 값입니다.";
      return;
    }

    horizontalOutput.innerText =
      horizontal.toFixed(3) + " m";

    verticalOutput.innerText =
      vertical.toFixed(3) + " m";
  }

  function resetCalculator() {
    document.getElementById("slopeValue").value = "";
    document.getElementById("knownLength").value = "";

    document.getElementById("horizontalResult").innerText = "- m";
    document.getElementById("verticalResult").innerText = "- m";
    document.getElementById("errorMessage").innerText = "";

    setMode("percent");
    setLengthType("horizontal");
  }
</script>

</body>
</html>
